name: Series Release Monitor

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      series_id:
        description: 'Specific Series ID to check (leave blank to check all active series)'
        required: false
        default: ''

jobs:
  check-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Series Tracker
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SERIES_SPREADSHEET_ID: ${{ secrets.SERIES_SPREADSHEET_ID }}
          TELEGRAM_OUTBOX_SPREADSHEET_ID: ${{ secrets.TELEGRAM_OUTBOX_SPREADSHEET_ID }}
        run: |
          if [ -n "${{ github.event.inputs.series_id }}" ]; then
            npm run series:check -- --id "${{ github.event.inputs.series_id }}"
          else
            npm run series:check -- --all
          fi
